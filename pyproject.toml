[build-system]
requires = ["setuptools>=64,<75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
name = "mini-pi-rl"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.8.*"
pip = "*"

[tool.pixi.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[tool.pixi.pypi-dependencies]
torch = { version = "==2.4.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = "==0.19.1", index = "https://download.pytorch.org/whl/cu124" }
torchaudio = { version = "==2.4.1", index = "https://download.pytorch.org/whl/cu124" }
numpy = "==1.23.5"
ninja = "==1.13.0"
isaacgym = { path = ".vendor/isaacgym/python", editable = true }
pi-rl-control = { path = ".", editable = true }

[tool.pixi.tasks]
check-gpu = 'python -c "import isaacgym; import torch; print(torch.__version__); print(torch.cuda.is_available()); print(torch.cuda.get_device_name(0))"'
check-deps = "python -m pip check"
train = { cmd = "python humanoid/scripts/train.py --task=pai_ppo --run_name first_test --headless --num_envs 64", env = { WANDB_MODE = "offline" } }
smoke-test = { cmd = "python humanoid/scripts/train.py --task=pai_ppo --run_name env_setup_check --headless --num_envs 64 --max_iterations 1", env = { WANDB_MODE = "disabled" } }
